---
# The artifacts VM: Artifact Keeper (package registry: Maven, npm, PyPI,
# generic...; role artifact_keeper: the install; its content is meant to come
# from Crossplane, gitops). The VM is created first when it does not exist
# (role libvirt_vm).
#   ansible-playbook artifacts.yml [--check --diff]
- name: Gitops checkout
  ansible.builtin.import_playbook: gitops.yml

- name: VM
  hosts: artifacts
  gather_facts: false
  tags: [vm]
  roles:
    - libvirt_vm

- name: Artifact Keeper
  hosts: artifacts
  become: true
  gather_facts: false          # site_guard gathers them
  roles:
    - site_guard
    - site_ca
    - artifact_keeper
