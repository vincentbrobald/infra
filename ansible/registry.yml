---
# The registry VM: Harbor (OCI registry and pull-through mirrors; role
# harbor: the install, its content comes from Crossplane, gitops), which
# replaced zot (tasks/zot-removed.yml).
# The VM is created first when it does not exist (role libvirt_vm).
#   ansible-playbook registry.yml [--check --diff]
- name: Gitops checkout
  ansible.builtin.import_playbook: gitops.yml

- name: VM
  hosts: registry
  gather_facts: false
  tags: [vm]
  roles:
    - libvirt_vm

- name: Registry
  hosts: registry
  become: true
  gather_facts: false          # site_guard gathers them
  roles:
    - site_guard
    - site_ca
    - harbor
  pre_tasks:
    - name: zot (replaced by Harbor)
      ansible.builtin.import_tasks: tasks/zot-removed.yml
