# The example.org infrastructure VMs (libvirt on this host, bridge0), for the
# playbooks in /root/lab/infra/ansible. Credentials are never written here: SSH
# keys and passwords are files under site_secrets_dir (group_vars/all.yml).
#
# vm: how the role libvirt_vm creates the VM when it does not exist
# (AlmaLinux 10). The MAC is derived from the host name unless given.
# Addressing: vm.network dhcp (site default, group_vars/all.yml) or static
# with vm.address, e.g. {name: pki, ..., network: static, address: 192.0.2.162}.
all:
  vars:
    ansible_user: almalinux
    ansible_ssh_private_key_file: "{{ site_secrets_dir }}/{{ vm.name | default(inventory_hostname_short) }}/id_ed25519"
  children:
    pki:
      hosts:
        pki.example.org:
          vm: {name: pki, memory: 1536, vcpus: 1, disk: 10G, mac: "52:54:00:00:00:01"}
    keycloak:
      hosts:
        oauth.example.org:
          vm: {name: oauth, memory: 4096, vcpus: 2, disk: 20G}
    forgejo:
      hosts:
        forgejo.example.org:
          # Created by /root/lab/deploy-fedora44.sh (Fedora 44); libvirt_vm would
          # re-create it as AlmaLinux 10 with the same user and key.
          ansible_user: fedora
          ansible_ssh_private_key_file: "{{ site_lab_dir }}/forgejo-test/vm/id_ed25519"
          vm: {name: forgejo, memory: 2048, vcpus: 2, disk: 20G}
    s3:
      hosts:
        backup.example.org:
          vm: {name: backup, memory: 2048, vcpus: 2, disk: 60G}
    registry:
      hosts:
        registry.example.org:
          vm: {name: registry, memory: 8192, vcpus: 4, disk: 100G}   # images on local disk; 8 GiB/4 vCPUs for Harbor
    artifacts:
      hosts:
        artifacts.example.org:
          vm: {name: artifacts, memory: 6144, vcpus: 4, disk: 60G}   # Artifact Keeper (artifacts.yml), packages on local disk
    # Optional: Omni, the Talos clusters console (omni.yml). Remove the group
    # to go without it.
    omni:
      hosts:
        omni.example.org:
          vm: {name: omni, memory: 4096, vcpus: 2, disk: 30G}
