---
# Forgejo on forgejo: the Git server, its users, tokens and repositories.
# The VM is created first when it does not exist (role libvirt_vm).
#   ansible-playbook forgejo.yml [--check --diff]
- name: Gitops checkout
  ansible.builtin.import_playbook: gitops.yml

- name: VM
  hosts: forgejo
  gather_facts: false
  tags: [vm]
  roles:
    - libvirt_vm

- name: Forgejo
  hosts: forgejo
  become: true
  gather_facts: false          # site_guard gathers them
  roles:
    - site_guard
    - site_ca
    - forgejo
