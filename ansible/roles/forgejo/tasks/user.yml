---
- name: Password of {{ user.name }}
  ansible.builtin.set_fact:
    forgejo_user_password: "{{ lookup('site_secret', user.password_file, generate='alnum:24') }}"
  no_log: true

- name: Look up {{ user.name }}
  ansible.builtin.uri:
    url: "{{ forgejo_api }}/users/{{ user.name }}"
    status_code: [200, 404]
    url_username: "{{ forgejo_as_admin.url_username }}"
    url_password: "{{ forgejo_as_admin.url_password }}"
    force_basic_auth: true
  register: forgejo_user
  check_mode: false              # read-only; needed for --check

- name: Create {{ user.name }}
  ansible.builtin.uri:
    url: "{{ forgejo_api }}/admin/users"
    method: POST
    url_username: "{{ forgejo_as_admin.url_username }}"
    url_password: "{{ forgejo_as_admin.url_password }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ user.name }}"
      email: "{{ user.email }}"
      full_name: "{{ user.full_name | default('') }}"
      password: "{{ forgejo_user_password }}"
      must_change_password: false
    status_code: 201
  when: forgejo_user.status == 404
  changed_when: true
  no_log: true

- name: Log in as {{ user.name }}
  ansible.builtin.uri:
    url: "{{ forgejo_api }}/user"
    url_username: "{{ user.name }}"
    url_password: "{{ forgejo_user_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: forgejo_user_login
  when: forgejo_user.status == 200
  check_mode: false

- name: Update {{ user.name }}
  ansible.builtin.uri:
    url: "{{ forgejo_api }}/admin/users/{{ user.name }}"
    method: PATCH
    url_username: "{{ forgejo_as_admin.url_username }}"
    url_password: "{{ forgejo_as_admin.url_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ {'login_name': user.name, 'source_id': 0, 'email': user.email, 'full_name': user.full_name | default(''),
               'must_change_password': false, 'admin': user.admin | default(false)}
              | combine({'password': forgejo_user_password} if forgejo_user_login.status | default(200) == 401 else {}) }}"
    status_code: 200
  # Also right after the creation of an admin (creating can't set the flag).
  when: >-
    (forgejo_user.status == 404 and user.admin | default(false)) or
    (forgejo_user.status == 200 and
     (forgejo_user_login.status == 401 or forgejo_user.json.email != user.email
      or forgejo_user.json.full_name != user.full_name | default('')
      or forgejo_user.json.is_admin != user.admin | default(false)))
  changed_when: true
  no_log: true

- name: Tokens of {{ user.name }}
  ansible.builtin.include_tasks: token.yml
  loop: "{{ user.tokens | default([]) }}"
  loop_control:
    loop_var: token
    label: "{{ token.name }}"
