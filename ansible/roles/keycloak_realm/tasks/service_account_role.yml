---
# The roles of one client (role_client) that client.service_account_roles
# lists, granted to the service account when missing.
- name: Look up client {{ role_client }}
  ansible.builtin.uri:
    url: "{{ keycloak_realm_url }}/admin/realms/{{ keycloak_realm_client_realm }}/clients?clientId={{ role_client | urlencode }}"
    headers: "{{ keycloak_realm_auth }}"
  register: keycloak_realm_role_client
  check_mode: false
  no_log: true

- name: Roles of {{ role_client }} held by the service account
  ansible.builtin.uri:
    url: "{{ keycloak_realm_url }}/admin/realms/{{ keycloak_realm_client_realm }}/users/{{ keycloak_realm_sa_user.json.id }}/role-mappings/clients/{{ keycloak_realm_role_client.json[0].id }}"
    headers: "{{ keycloak_realm_auth }}"
  register: keycloak_realm_role_held
  check_mode: false

- name: Roles of {{ role_client }} available
  ansible.builtin.uri:
    url: "{{ keycloak_realm_url }}/admin/realms/{{ keycloak_realm_client_realm }}/clients/{{ keycloak_realm_role_client.json[0].id }}/roles"
    headers: "{{ keycloak_realm_auth }}"
  register: keycloak_realm_role_all
  check_mode: false

- name: Grant the missing roles of {{ role_client }}
  ansible.builtin.uri:
    url: "{{ keycloak_realm_url }}/admin/realms/{{ keycloak_realm_client_realm }}/users/{{ keycloak_realm_sa_user.json.id }}/role-mappings/clients/{{ keycloak_realm_role_client.json[0].id }}"
    method: POST
    headers: "{{ keycloak_realm_auth }}"
    body_format: json
    body: "{{ keycloak_realm_role_all.json | selectattr('name', 'in', missing) | list }}"
    status_code: 204
  vars:
    wanted: "{{ client.service_account_roles | selectattr('client', 'equalto', role_client) | map(attribute='role') | list }}"
    missing: "{{ wanted | difference(keycloak_realm_role_held.json | map(attribute='name')) }}"
  when: missing | length > 0
  changed_when: true
