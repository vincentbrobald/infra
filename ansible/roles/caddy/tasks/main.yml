---
- name: Enable the Caddy COPR repository
  ansible.builtin.command: "dnf -y copr enable {{ caddy_copr }}"
  args:
    creates: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:{{ caddy_copr | regex_replace('^@', 'group_') | replace('/', ':') }}.repo"
  when: ansible_facts.distribution != 'Fedora'

- name: Install Caddy
  ansible.builtin.dnf:
    name: caddy
    state: present

- name: Caddy release binary
  ansible.builtin.include_tasks: binary.yml
  when: caddy_version | length > 0

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: "{{ '/usr/local/bin/caddy' if caddy_version else 'caddy' }} validate --config %s --adapter caddyfile"
  notify: Reload caddy

- name: Start Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: started
    enabled: true

- name: Apply a pending Caddy reload
  ansible.builtin.meta: flush_handlers
