---
# RustFS (S3) on backup: buckets and users of the etcd backups and the registry.
# The VM is created first when it does not exist (role libvirt_vm).
#   ansible-playbook backup.yml [--check --diff]
- name: Gitops checkout
  ansible.builtin.import_playbook: gitops.yml

- name: VM
  hosts: s3
  gather_facts: false
  tags: [vm]
  roles:
    - libvirt_vm

- name: Object storage
  hosts: s3
  become: true
  gather_facts: false          # site_guard gathers them
  roles:
    - site_guard
    - site_ca
    - rustfs
